name: check
# v1.5.4：内容与 v1.5.0 等价（+本注释行）——换 blob 以绕开平台对旧 blob 的编译缓存缺陷（同内容 3ad58c23 在 b89d886 编译正常、370516d 编译残缺，实测）
on:
  workflow_call:
    inputs:
      runtime:      { type: string, default: "none" }   # node | python | go | none
      node-version: { type: string, default: "24" }
      python-version: { type: string, default: "3.13" }
      go-version:   { type: string, default: "1.24" }
      runs-on:      { type: string, default: "ubuntu-latest" }
      # P2-9（ADR-0043）：重试包装器钉源——必须与 caller 的 uses: pin 同值（40 位
      # SHA，空=fail-closed 红；#86 实测 github.workflow_ref 在 reusable 上下文
      # 解析为 caller 自身 ref，不可用于钉源）
      ciw-ref:      { type: string, default: "" }

permissions: {}

jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15   # 熔断上限（红队 #4 P1-2）；make check 时长随业务仓而异，15min=上限非目标
    permissions:
      contents: read
    steps:
      - name: Harden Runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85b0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: inputs.runtime == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - if: inputs.runtime == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      # uv 安装器换 SHA 锚定 action（ADR-0011 遗留项落地：curl|sh 不可哈希校验）
      - if: inputs.runtime == 'python'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - if: inputs.runtime == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: make setup
        run: make setup

      - name: 校验 ciw-ref 钉源（fail-closed）
        env:
          CIW_REF: ${{ inputs.ciw-ref }}   # zizmor template-injection：模板值经 env 间接引用，不内插进脚本
        run: |
          if ! [[ "$CIW_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ciw-ref 必须为 40 位 SHA 且与 uses: pin 同值（ADR-0043——reusable 上下文 workflow_ref 不可钉源）"; exit 1
          fi

      - name: 取重试包装器（CI-Workflows@ciw-ref）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Cloudbird-Software/CI-Workflows
          ref: ${{ inputs.ciw-ref }}
          path: ciw-scripts
          persist-credentials: false

      - name: make check（flaky-retry ≤N，入账）
        run: bash ciw-scripts/scripts/flaky-retry.sh make check

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ inputs.runs-on }}
          path: |
            reports/
            coverage/
          if-no-files-found: ignore
          retention-days: 14
