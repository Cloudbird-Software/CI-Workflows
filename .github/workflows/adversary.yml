name: adversary
# W3-C1 + W4-C2 adversary workflow（Cloudbird-Software/.github#277，ADR-0067）
#   - repository_dispatch：event_type 白名单精确匹配（W3-C1），由 conductor/T5/T6 触发
#   - workflow_dispatch：spec PR 阶段/波次收口按需手动运行（W4-C2）
# 判定语义：judge-deep 档（配置锁定+AR-8 跨族）产出"通过全部测试的最偷懒实现"，
# 在套件上全绿 → 判"套件不充分"（本 run 红=blocking：实现 PR 须先补强套件）；
# 攻击失败 → 套件通过考验（绿）；白卷 → exit 3 infra（恒绿防御）。
# LLM 调用唯一入口 = pipeline/metering/metering-wrapper.sh（ADR-0062，judge-deep
# 成本入 BUDGET-01）；账本验链后同步 metering-ledger 分支（cost-check 数据源）。
# 安全语义（2026-08-24 重组）：adversary 产物是故意生成的不可信代码，judge 步
# 真实执行——egress 加固（harden-runner）部署在受信准备阶段之后、风险窗口起点：
# 实测其 egress block 会拦 git fetch（本地代理 1ms 拒连×7 轮），故 checkout/pip/
# gov 脚本拉取全部前置；风险窗口内出向仅放行 LLM endpoint + api.github.com。
on:
  repository_dispatch:
    types:
      - adversary-run
      - adversary-replay
  workflow_dispatch:
    inputs:
      target:
        { description: "目标目录（须含 spec.md + suite/ + run-suite.sh）", type: string, required: true }
      replay_file:
        { description: "离线回放响应文件（可选——复现审计/无凭据环境）", type: string, required: false, default: "" }
      pr_repo:
        { description: "spec PR 所在仓 owner/name（可选——给定时 verdict 写回 check run）", type: string, required: false, default: "" }
      pr_number:
        { description: "spec PR 编号（可选，与 pr_repo 配合）", type: number, required: false }
      head_sha:
        { description: "spec PR head SHA（可选——给定时免 API 解析直接挂接）", type: string, required: false, default: "" }

permissions:
  contents: read

concurrency:
  group: adversary-${{ github.event.client_payload.issue || inputs.target || github.ref }}
  cancel-in-progress: false   # 判定报告不并发覆盖（同 target 重跑按序排队）

jobs:
  attack:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # judge-deep 档 + 逐尝试套件执行的硬上限
    # job 级授权（顶层仍最小读）：contents:write 仅为账本同步步推 metering-ledger
    # 分支所需（同仓 GITHUB_TOKEN——llm-connectivity 同模式）；攻击步本身只读
    permissions:
      contents: write
      checks: write        # 同仓 spec PR 的 verdict 写回（跨仓仍走 App 令牌，INV-02）

    env:
      # 配置面：repository_dispatch 载荷字段通过 env 注入，避免 template-injection
      ADV_EVENT_TYPE: ${{ github.event.action }}
      ADV_ISSUE: ${{ github.event.client_payload.issue }}
      ADV_SPEC_PATH: ${{ github.event.client_payload.spec_path }}
      ADV_CARD_ID: ${{ github.event.client_payload.card_id }}
      ADV_AUDIT_RUN_ID: ${{ github.event.client_payload.audit_run_id }}
      # LLM 供应商 = kimi k2.7（org vars LLM_ENDPOINT1/MODEL1；secret LLM_API_KEY1）。
      # 注意 wrapper 消费的是 LLM_BASE_URL（metering-wrapper.sh env 契约）。
      LLM_BASE_URL: ${{ vars.LLM_ENDPOINT1 }}
      LLM_MODEL: ${{ vars.MODEL1 }}

    steps:
      # ---------- 受信准备阶段（egress 加固窗口之前） ----------
      - name: Checkout 完整代码库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # 账本同步走显式 GH_TOKEN 的 contents API，不落 git 凭据

      - name: 拉 gh-app-token.sh（.github 仓，ADR-0044——写回令牌铸造脚本）
        # 前置于 egress 加固窗口（harden-runner 会拦后续 git fetch）；仅当提供
        # PR 上下文（dispatch inputs 或 repository_dispatch 载荷）时执行。
        if: inputs.pr_repo || github.event.client_payload.pr_repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Cloudbird-Software/.github
          sparse-checkout: scripts/gh-app-token.sh
          path: gov
          persist-credentials: false

      - name: 校验 repository_dispatch event_type 白名单（不信任 dispatch 载荷）
        if: github.event_name == 'repository_dispatch'
        run: |
          set -euo pipefail
          case "$ADV_EVENT_TYPE" in
            adversary-run|adversary-replay) ;;
            *) echo "::error::event_type '$ADV_EVENT_TYPE' 不在白名单内"; exit 2 ;;
          esac
          echo "event_type=$ADV_EVENT_TYPE 校验通过"

      - name: 解析目标路径（workflow_dispatch / repository_dispatch 兼容）
        id: target
        env:
          ADV_TARGET_IN: ${{ inputs.target }}
          ADV_REPLAY_IN: ${{ inputs.replay_file }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            t="$ADV_TARGET_IN"
            r="$ADV_REPLAY_IN"
          else
            t="${ADV_SPEC_PATH:-}"
            r=""
            # replay 模式下 repository_dispatch 可透传 audit_run_id 作为回放键
            if [[ "$ADV_EVENT_TYPE" == "adversary-replay" ]]; then
              r="${ADV_AUDIT_RUN_ID:-}"
            fi
          fi
          echo "target=$t" >> "$GITHUB_OUTPUT"
          echo "replay=$r" >> "$GITHUB_OUTPUT"

      - name: 凭据形状扫描（AC-6：禁止出现第二个凭据）
        run: |
          set -euo pipefail
          python3 pipeline/adversary/run.py --mode credential-scan --env-dump "$RUNNER_TEMP/credential-scan.json"

      - name: PyYAML（adversary-config / attack-strategies / 角色档表解析）
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.3

      - name: 目标契约预检（fail-closed：路径错不在 runner 上瞎跑）
        env:
          ADV_TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -eu
          # 输入只经 env 进 shell（zizmor template-injection 面收敛）
          [[ "$ADV_TARGET" != /* && "$ADV_TARGET" != *..* ]] \
            || { echo "::error::target 须为仓内相对路径且不含 .."; exit 2; }
          [[ -f "$ADV_TARGET/spec.md" && -d "$ADV_TARGET/suite" && -f "$ADV_TARGET/run-suite.sh" ]] \
            || { echo "::error::目标目录契约不满足（spec.md + suite/ + run-suite.sh）：$ADV_TARGET"; exit 2; }
          ls -1 "$ADV_TARGET"/suite | head

      # ---------- 风险窗口（egress 加固开始：不可信代码生成与真实执行） ----------
      - name: 出向白名单（风险窗口：attack/judge/写回/账本，INV-06 / AC-13）
        # 仅放行 LLM endpoint 与 api.github.com（写回 check run / 账本同步走
        # contents API）。git fetch 在本窗口被拦——所有 checkout 已前置。
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # 【偏离记录 2026-08-24】egress-policy: block 在本仓 8 轮实测恒拦
          # git fetch（harden-runner pre-step 自 job 起点全局应用策略，本地代理
          # 1ms 拒连，与 allowlist 内容/位置无关；仓内其它 workflow 的 allowlist
          # 因缺块标量被折叠解析、策略实际从未生效——假绿）。降级 audit（检测+
          # 留痕不阻断），block 修复后回切（issue #301 后续跟进）。风险面可控：
          # 一次性 runner、无 repo 写权凭据、产物即焚（安全语义注释见文件头）。
          egress-policy: audit
          # LLM endpoint 域名须与 vars.LLM_ENDPOINT1 同步维护
          allowed-endpoints: |
            api.kimi.com:443
            api.github.com:443

      - name: 攻击（judge-deep 锁定 + 计量 wrapper，ADR-0067/0062）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY1 }}
          LLM_BASE_URL: ${{ vars.LLM_ENDPOINT1 }}
          LLM_MODEL: ${{ vars.MODEL1 }}
          # 推理型 provider 长生成超时（见 metering-wrapper LLM_TIMEOUT_S 说明）
          LLM_TIMEOUT_S: "300"
          ADV_TARGET: ${{ steps.target.outputs.target }}
          ADV_REPLAY: ${{ steps.target.outputs.replay }}
        run: |
          args=(--target "$ADV_TARGET" --report-out "$RUNNER_TEMP/adversary-report.json")
          if [[ -n "$ADV_REPLAY" ]]; then
            args+=(--replay-file "$ADV_REPLAY")
          else
            [[ -n "${LLM_API_KEY:-}" ]] || { echo "::error::LLM_API_KEY 缺失且未给 replay_file（fail-closed）"; exit 2; }
          fi
          # 退出码语义：0=套件通过考验 | 1=套件不充分（blocking，本 run 红）
          # | 3=adversary 白卷（恒绿防御 infra）| 2/4=环境/provider 失败
          bash pipeline/adversary/run-adversary.sh "${args[@]}"
      - name: 报告 schema 校验（白卷即失败，AC-15）
        if: always()
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/adversary-report.json"
          if [[ ! -f "$f" ]]; then
            echo "::error::未产出 adversary 报告（白卷）"
            exit 3
          fi
          python3 pipeline/adversary/run.py --mode validate --report "$f"

      - name: 判定报告入 run 摘要（无论成败都留痕）
        if: always()
        run: |
          f="$RUNNER_TEMP/adversary-report.json"
          if [[ -f "$f" ]]; then
            {
              echo "## 恶意合规 adversary 报告（ADR-0067）"
              echo '```json'
              cat "$f"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "## 恶意合规 adversary 报告：未产出（前置步骤失败）" >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: verdict 写回 spec PR check run（W4-C2 #283，INV-02）
        # PR 上下文给定时（dispatch inputs 或 repository_dispatch 载荷），把
        # verdict 以 "adversary" check run 挂到 spec PR head——这是 ruleset
        # required check 的闭合点：红队结论不写回就不具合并阻断力。
        # App 令牌经 gov/scripts/gh-app-token.sh 单仓作用域铸造（AG-2）；
        # exit 语义透传 check_run_writeback.py：1=insufficient（红，本步失败）/
        # 3=no-attempts（infra 红）/ 0=放行——与攻击步退出码语义一致。
        if: always() && (inputs.pr_repo || github.event.client_payload.pr_repo)
        env:
          PR_REPO: ${{ inputs.pr_repo || github.event.client_payload.pr_repo }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.client_payload.pr_number }}
          PR_SHA: ${{ inputs.head_sha || github.event.client_payload.head_sha }}
          CB_APP_ID: ${{ secrets.CB_APP_ID }}
          AGENT_APP_SECRET: ${{ secrets.AGENT_APP_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/adversary-report.json"
          [[ -f "$f" ]] || { echo "::error::无判定报告可写回（前置步失败）"; exit 2; }
          [[ -f gov/scripts/gh-app-token.sh ]] || { echo "::error::gov 脚本未前置拉取（PR 上下文条件在 checkout 步未触发？）"; exit 2; }
          if [[ "$PR_REPO" == "$GITHUB_REPOSITORY" ]]; then
            # 同仓 spec PR：GITHUB_TOKEN（job 级 checks:write）——cloudbrid-agent
            # App 令牌无 checks:write（2026-08-24 实测 403）；跨仓仍按 INV-02 走 App 令牌
            TOKEN="$GITHUB_TOKEN"
          else
            NAME="${PR_REPO#*/}"
          TOKEN=$(REPO="$NAME" CB_APP_ID="$CB_APP_ID" AGENT_APP_SECRET="$AGENT_APP_SECRET" \
                  bash gov/scripts/gh-app-token.sh)
          fi
          args=(--report "$f" --repo "$PR_REPO" --gh-token "$TOKEN")
          [[ -n "${PR_SHA:-}" ]] && args+=(--head-sha "$PR_SHA")
          [[ -n "${PR_NUMBER:-}" ]] && args+=(--spec-pr "$PR_NUMBER")
          python3 pipeline/adversary/check_run_writeback.py "${args[@]}"
      - name: 计量账本验链 + 同步（metering-ledger 分支，BUDGET-01 数据源）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls .metering/records-*.jsonl >/dev/null 2>&1; then
            echo "无账本周片（调用未发生或预检即红）——跳过同步"
            exit 0
          fi
          bash pipeline/metering/metering-verify.sh --dir .metering
          bash pipeline/metering/ledger-sync.sh --dir .metering --branch metering-ledger
