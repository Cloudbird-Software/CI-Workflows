name: adversary-gate
# W4-C3 adversary gate（Cloudbird-Software/.github#284，AC-14/AC-19，ADR-0067/0082）
#
# 目标：specs/** 路径 PR 必须含 adversary check（漏配/摘除/跳过即红）；开发路径
# 豁免谓词由 diff 路径集确定性派生（禁人工打标，AC-14）。
#
# 机制（org-required-workflows required workflow——本仓为源仓，钉点由
# governance/rulesets/org-required-workflows.json 管理）：
#   - 本 workflow 在每 PR 上运行（目标仓上下文），产出名为 "adversary" 的
#     check run（main-protection required check 的闭合点）。
#   - 预检：用 gh + github.token 判断 PR 是否含 specs/** 变更。
#   - 非 specs PR → 直接写 success check run，放行（EXPECTED_SKIP，零外部依赖）。
#   - specs PR → 铸 App 令牌，查 head sha 上是否存在 verdict=survived 的
#     adversary check run；不存在/结论非 success 即红（fail-closed）。
#
# 与 .github 仓同名 workflow 的差异：作为跨仓 required workflow 运行在目标仓
# 上下文，gh-app-token.sh 须从 .github 仓 sparse-checkout（ADR-0044）。
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    # merge queue 兼容（2026-08-24）：required workflow 不在队列分支上自动运行，
    # 队列 merge commit 会永远等不到 adversary check（60min 超时弹回）——本 gate
    # 在 checks_requested 时对比 base..head，无 specs/** 变更即写 success（与
    # PR 路径同语义）；有 specs 变更的合并需人工补 survived 审计（fail-closed）。
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: adversary-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: merge_group 路径——对比 base..head 判定 specs 变更并直写 check
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          FILES=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '[.files[].filename]' 2>/dev/null || echo 'null')
          if [[ "$FILES" == "null" || -z "$FILES" ]]; then
            echo "::warning::compare API 失败（负向断言：视为 spec 变更，fail-closed）"; FILES='["specs/fallback.md"]'
          fi
          HASSPECS=$(echo "$FILES" | python3 -c "import json,sys;files=json.load(sys.stdin);print('true' if any(f.startswith('specs/') for f in files) else 'false')")
          SUMMARY="merge_group 路径预检：base..head specs/** 变更=$HASSPECS"
          if [[ "$HASSPECS" == "true" ]]; then
            echo "::error::merge queue 提交含 specs/** 变更——需人工确认 survived 审计后重试（fail-closed）"
            exit 1
          fi
          python3 - "$SUMMARY" > "$RUNNER_TEMP/check_body.json" <<'PYEOF2'
          import json, sys, os, datetime as dt
          json.dump({
              "name": "adversary",
              "head_sha": os.environ["HEAD_SHA"],
              "status": "completed",
              "conclusion": "success",
              "completed_at": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "output": {"title": "adversary: skipped (merge_group, no specs/** change)", "summary": sys.argv[1]},
          }, sys.stdout)
          PYEOF2
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/check-runs"             -d @"$RUNNER_TEMP/check_body.json"
          echo "merge_group：adversary check run 已写回 success（EXPECTED_SKIP）"

      - name: 预检 PR 是否含 specs/** 变更（gh + github.token）
        # 2026-08-31 精化（AC-14 豁免谓词确定性派生，与 .github#481 同步）：specs/**
        # 命中只统计**可审计 spec 体**——变更路径所属 specs/<dir>/ 在 PR head 上
        # 存在 spec.md（adversary 目标契约 specs/<dir>/{spec.md,suite/,run-suite.sh}
        # 的判别面）。specs/ 下无 spec.md 的目录（如 test-freeze 的 MANIFEST
        # 派生哈希账本）是机器可校验资产而非红队审计对象——其完整性由
        # 自身哈希链/签名执法，红队无面可攻。判定仍由 diff 路径集 + head 树
        # 确定性派生（禁人工打标）；API 失败负向断言不变（fail-closed）。
        if: github.event_name == 'pull_request'
        id: specspr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_API: "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          set +e
          FILES=$(gh api "$PR_API/files?per_page=300" --jq '[.[].filename]' 2>/dev/null)
          RC=$?
          set -e
          if [[ $RC -ne 0 || -z "$FILES" || "$FILES" == "null" ]]; then
            # API 失败 → 负向断言：视为 spec 变更，走完整审计路径
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
            echo "::warning::取 PR files 失败（负向断言：视为 spec 变更）"
          else
            SPECS_HITS=$(echo "$FILES" | python3 -c "import json,sys;files=json.load(sys.stdin);print('\n'.join(f for f in files if f.startswith('specs/')))")
            if [[ -z "$SPECS_HITS" ]]; then
              echo "has_specs=false" >> "$GITHUB_OUTPUT"
            else
              # 逐变更 specs 目录核验可审计性（head 树上 specs/<dir>/spec.md 存在）
              AUDITABLE=0; ADJACENT_DIRS=""
              for d in $(echo "$SPECS_HITS" | sed 's|^specs/||' | cut -d/ -f1 | sort -u); do
                [[ -n "$d" ]] || continue
                if gh api "repos/${{ github.repository }}/contents/specs/$d/spec.md?ref=$HEAD_SHA" >/dev/null 2>&1; then
                  AUDITABLE=1
                else
                  ADJACENT_DIRS="$ADJACENT_DIRS $d"
                fi
              done
              # specs/ 根下直挂文件（无目录层）→ fail-closed 视为可审计（红队判别面外不放行）
              if echo "$SPECS_HITS" | grep -qv '^specs/[^/]*/'; then AUDITABLE=1; fi
              if [[ $AUDITABLE -eq 1 ]]; then
                echo "has_specs=true" >> "$GITHUB_OUTPUT"
              else
                echo "has_specs=adjacent" >> "$GITHUB_OUTPUT"
                echo "adjacent_dirs=$(echo $ADJACENT_DIRS)" >> "$GITHUB_OUTPUT"
                echo "specs 邻接变更（无可审计 spec 体）：$ADJACENT_DIRS"
              fi
            fi
          fi

      - name: specs 邻接变更（无 spec.md 审计体）——写 success check run 放行
        # EXPECTED_SKIP（AC-14）：specs/** 命中但全部属无 spec.md 的目录
        # （MANIFEST/README 类派生资产）——确定性派生豁免，非人工打标。
        if: steps.specspr.outputs.has_specs == 'adjacent'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUMMARY="specs/** 邻接变更但无可审计 spec 体（${{ steps.specspr.outputs.adjacent_dirs }} 无 spec.md，adversary 目标契约不成立）：EXPECTED_SKIP=True（AC-14 确定性派生豁免——哈希账本/MANIFEST 类资产由自身哈希链执法）"
          python3 - "$SUMMARY" > "$RUNNER_TEMP/check_body.json" <<'PYEOF3'
          import json, sys, datetime as dt
          summary = sys.argv[1]
          json.dump({
            "name": "adversary",
            "head_sha": "${{ github.event.pull_request.head.sha }}",
            "status": "completed",
            "conclusion": "success",
            "completed_at": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "output": {"title": "adversary: skipped (specs-adjacent, no auditable spec body)", "summary": summary},
          }, sys.stdout)
          PYEOF3
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs" \
            -d @"$RUNNER_TEMP/check_body.json" \
            && echo "specs 邻接变更：adversary check run 已写回 success（EXPECTED_SKIP）"

      - name: 非 specs PR——写 success check run 并放行（github.token）
        if: steps.specspr.outputs.has_specs == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SUMMARY="specs/** 未变更：EXPECTED_SKIP=True（路径预检：diff 无 specs/ 前缀文件）"
          python3 - "$SUMMARY" > "$RUNNER_TEMP/check_body.json" <<'PYEOF'
          import json, sys, os, datetime as dt
          json.dump({
              "name": "adversary",
              "head_sha": os.environ["HEAD_SHA"],
              "status": "completed",
              "conclusion": "success",
              "completed_at": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "output": {"title": "adversary: skipped (no specs/** change)", "summary": sys.argv[1]},
          }, sys.stdout)
          PYEOF
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/check-runs" \
            -d @"$RUNNER_TEMP/check_body.json" \
            && echo "非 specs PR：adversary check run 已写回 success"

      - name: specs PR——校验 adversary check run 已存在且 survived
        # 2026-08-24 改造：本 gate 恒运行于 PR 所属仓上下文（pull_request 事件或
        # required workflow 注入），github.token（job 级 checks:write）足以读写本仓
        # check run——原 App 令牌铸造路径因 AGENT_APP_SECRET 失效连红三天
        # （spec-author 2026-08-21 起实测），去除该单点。
        if: steps.specspr.outputs.has_specs == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GATE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUMMARY="specs/** 变更 PR：校验 adversary check run"
          CHECKS=$(curl -fsS \
            -H "Authorization: Bearer $GATE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" 2>/dev/null) \
            || CHECKS='{"check_runs":[]}'
          VERDICT=$(echo "$CHECKS" | python3 -c "
          import json,sys
          runs=json.loads(sys.stdin.read()).get('check_runs',[])
          adv=sorted([r for r in runs if r.get('name')=='adversary'], key=lambda r:(r.get('status')!='completed',))
          if not adv:
              print('MISSING')
          else:
              a=adv[-1]
              if a.get('status')=='completed' and a.get('conclusion')=='success':
                  print('SURVIVED')
              elif a.get('status')=='completed':
                  print('RED:'+str(a.get('conclusion')))
              else:
                  print('PENDING:'+str(a.get('status')))
          ")
          if [[ "$VERDICT" == "SURVIVED" ]]; then
            echo "adversary check run 已存在且 survived：$SUMMARY"
            exit 0
          fi
          # 未审计/未 survived：写 failure check run（阻断合并，AC-4 负向断言）
          if [[ "$VERDICT" == MISSING* ]]; then
              TITLE="adversary: 缺失（specs/** PR 未含 adversary check，阻断）"
          else
              TITLE="adversary: ${VERDICT}（specs/** PR 审计未通过，阻断）"
          fi
          python3 - "$TITLE" "$SUMMARY" > "$RUNNER_TEMP/check_body.json" <<'PYEOF'
          import json, sys, os, datetime as dt
          json.dump({
              "name": "adversary",
              "head_sha": os.environ["HEAD_SHA"],
              "status": "completed",
              "conclusion": "failure",
              "completed_at": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "output": {"title": sys.argv[1][:255], "summary": sys.argv[2]},
          }, sys.stdout)
          PYEOF
          curl -fsS -X POST \
            -H "Authorization: Bearer $GATE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/check-runs" \
            -d @"$RUNNER_TEMP/check_body.json"
          echo "阻断：$VERDICT —— $SUMMARY"
          exit 1
