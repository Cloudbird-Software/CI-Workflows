name: dependency-review
on:
  workflow_call:
    inputs:
      # 可选：按 PURL 豁免指定包的许可证检查（逗号分隔，如
      # pkg:pypi/psycopg-binary）。用于 GitHub 依赖图许可证归一化误报的
      # 精确豁免——调用仓自证并留痕，org deny 清单本体不变。
      # 空串时 action 侧 getOptionalInput 返回 undefined，行为与不传一致。
      allow-dependencies-licenses:
        description: 'PURL list (comma-separated) exempted from license checks'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 熔断上限（红队 #4 P1-2）
    permissions:
      contents: read
      pull-requests: write   # comment-summary-in-pr 摘要评论；该权限按 GitHub 语义含评审写操作（APPROVE/REQUEST_CHANGES），org 级 can_approve_pull_request_reviews=false 封堵审批落地；见 README 权限模型
    steps:
      - name: Harden Runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure
          allow-dependencies-licenses: ${{ inputs.allow-dependencies-licenses }}
