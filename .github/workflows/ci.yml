name: CI
on:
  pull_request:
    # edited（qodo review #1）：adr-required 消费可变的 PR title/body——
    # 不订阅 edited 则作者可在 check 通过后编辑掉 ADR 引用而不触发重验；
    # 反向场景（补 ADR 引用救活 fail 的 check）同样依赖 edited 重触发
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 熔断上限（红队 #4 P1-2：无 timeout 的 job 卡死=runner 无限占用+合并阻塞）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: No big files / no secret-ish files
        run: |
          set -eu
          git ls-files > /tmp/f.txt
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt 5242880 ]; then
              echo "::error file=$f::>5MB ($sz bytes)，用 Release 附件或 LFS"; fail=1
            fi
            case "$f" in
              .env.example) ;;
              *.env|.env.*|*.pem|*.key|*.pfx|*.p12|*.keystore|*.jks|*id_rsa*)
                echo "::error file=$f::不该提交的凭据类文件"; fail=1;;
            esac
          done < /tmp/f.txt
          exit $fail

      - name: Secret scan (gitleaks CLI, 全历史)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver=$(gh release view --repo gitleaks/gitleaks --json tagName -q .tagName)
          v=${ver#v}
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${ver}/gitleaks_${v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git . --redact --no-banner --exit-code 1

      - name: Actions 自身安全审计 (zizmor)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uvx" zizmor --persona regular --min-severity medium .

  gate:
    if: always()
    needs: [hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 5    # testing.yaml "gate<5min" 原则的硬上限
    permissions:
      pull-requests: read   # job 级最小权限（coderabbit review：本 job 无 checkout，
                            # pulls/files API 仅需 pull-requests:read——不留多余 contents:read）
    steps:
      - name: All required jobs green?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | jq -e '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")] | length > 0' >/dev/null; then
            echo "::error::有 job 未通过"; exit 1
          fi

      # adr-required（红队二批 ADR-0016 决策 1：README「修改规则」声明本检查但此前
      # 无实现——声执不一致。对齐 .github gate.yml / agent-registry validate.yml 同模型）：
      # 本仓整体即 C1 治理资产（全部 workflow 被业务仓 @v1 消费、README/zizmor 是治理声明）。
      # 被引 ADR 的存在性不在 PR 上下文做：决策落盘在私有仓 agent-registry/decisions/，
      # PR 上下文 GITHUB_TOKEN 无跨仓读权，注入 org secret = 向 PR 控制代码暴露凭据
      # （zizmor secret-exposure 模型）——存在性由 .github drift-check.sh §10 每日后验。
      - name: adr-required（C1 变更须引用 ADR）
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # 文件清单三防线（qodo review #2 #3）：
          # --paginate：>100 文件的 PR 首页截断会把 C1 变更漏检成非 C1；
          # rename 的 previous_filename 一并纳入——把 C1 资产改名移出受管路径
          # 同样是 C1 变更（files API 对 rename 只在 previous_filename 暴露原路径）；
          # files API 3000 文件硬上限：返回数 < changed_files = 清单不完整，
          # fail-closed（宁误杀不放过——超大 PR 的 C1 判定完整性无法保证）。
          PR_API="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
          FILES_API="$PR_API/files?per_page=100"
          CHANGED=$(gh api "$PR_API" --jq '.changed_files')
          FILES_CUR=$(gh api --paginate "$FILES_API" --jq '.[].filename')
          GOT=$(grep -c . <<<"$FILES_CUR" || true)
          if [ "$GOT" -lt "$CHANGED" ]; then
            echo "::error::PR 声明变更 $CHANGED 个文件但 files API 只返回 $GOT 个（3000 上限截断）——C1 判定完整性无法保证，fail-closed"
            exit 1
          fi
          FILES=$( { echo "$FILES_CUR"; gh api --paginate "$FILES_API" --jq '[.[].previous_filename // empty][]'; } )
          if ! echo "$FILES" | grep -qE '^(\.github/|zizmor\.yml|README\.md)'; then
            echo "非 C1 路径变更，跳过 adr-required"
            exit 0
          fi
          # 词边界：NOTADR-0016junk 之类子串不得满足 ADR 引用要求
          ADR_RE='\bADR-[0-9]{4}\b'
          if { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -qE "$ADR_RE"; then
            echo "OK adr-required: $( { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -oE "$ADR_RE" | sort -u | tr '\n' ' ')（存在性后验：.github drift-check §10）"
          else
            echo "::error::C1 路径变更但 PR 未引用任何 ADR-NNNN（README 修改规则：本仓变更属 C1 治理路径，须引用 ADR——落盘 agent-registry/decisions/）"
            exit 1
          fi
