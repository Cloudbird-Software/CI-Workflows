name: CI
on:
  pull_request:
    # edited（qodo review #1）：adr-required 消费可变的 PR title/body——
    # 不订阅 edited 则作者可在 check 通过后编辑掉 ADR 引用而不触发重验；
    # 反向场景（补 ADR 引用救活 fail 的 check）同样依赖 edited 重触发
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 熔断上限（红队 #4 P1-2：无 timeout 的 job 卡死=runner 无限占用+合并阻塞）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: No big files / no secret-ish files
        run: |
          set -eu
          git ls-files > /tmp/f.txt
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt 5242880 ]; then
              echo "::error file=$f::>5MB ($sz bytes)，用 Release 附件或 LFS"; fail=1
            fi
            case "$f" in
              .env.example) ;;
              *.env|.env.*|*.pem|*.key|*.pfx|*.p12|*.keystore|*.jks|*id_rsa*)
                echo "::error file=$f::不该提交的凭据类文件"; fail=1;;
            esac
          done < /tmp/f.txt
          exit $fail

      - name: Secret scan (gitleaks CLI, 全历史；版本+sha256 双锚定)
        run: |
          set -eu
          # 版本钉死 + 内联 sha256 校验（ADR-0011 遗留项落地：scorecard
          # PinnedDependencies "downloadThenRun not pinned by hash"——
          # latest-release 浮动下载改为显式版本+哈希双锚定）
          GL_VER="8.30.1"
          GL_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${GL_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks git . --redact --no-banner --exit-code 1

      # uv 安装器换 SHA 锚定 action（ADR-0011 遗留项落地：curl|sh 不可哈希校验）
      - name: Setup uv（版本钉死）
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Actions 自身安全审计 (zizmor)
        run: |
          uvx zizmor@1.29.0 --persona regular --min-severity medium .

      # P2-5（ADR-0039）：dep policy 落盘 + gate 可解析校验。schema 校验保证
      # policy/dependency-supply-chain.yaml 可被 dep-review 消费（阈值修订=C1
      # 变更须引用 ADR）；self-test 为 #90 T6 单元级证明——同一成熟依赖在
      # min_age_days=90 判绿、10000 判红，钉死"判定消费 policy 阈值而非硬编码"。
      - name: dep policy 可解析校验 + self-test (ADR-0039)
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.3
          python3 scripts/dep-supply-chain-check.py --policy policy/dependency-supply-chain.yaml --validate-only
          python3 scripts/dep-supply-chain-check.py --self-test

  test-integrity-selftest:
    # T8 单元级自检（ADR-0035 / .github #86）：fixture 预标注 vs 检测器输出全比对
    # （断言计数/skip 计数/文件删除判定）。本 job 为 PR 级回归兜底；test-integrity.yml
    # 每次执法前也会前置跑同一 fixture 集（同 ADR-0037 --self-test 模式）。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: T8 fixtures（15 case：四类篡改 + 正常 + 边界）
        run: bash scripts/test-integrity-fixtures/run.sh

  metering-selftest:
    # 计量 wrapper 自测（W2-C3 .github#216 / ADR-0062 决策 6，宪法 §4E 判定物
    # 有效性）：T1 流式聚合恰一条（spike T8 教训）+ invoke_id 去重执法、T2 BEH-09
    # 字段齐全、T3 hash 链篡改负控制、T4 INV-06 直连扫描双形态、T5 按角色档
    # 归账、T6 llm-usage/v1 兼容件、T7 ledger-sync 干跑——零真实 LLM 调用。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PyYAML（scan-patterns.yaml / 角色档表解析）
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.3
      - name: 计量自测 T1-T7
        run: bash pipeline/metering/selftest/run-selftest.sh
      - name: INV-06 仓级默认扫描（豁免面=wrapper 本体+一期入口，见 scan-patterns.yaml）
        run: bash pipeline/metering/scan-direct-sdk.sh

  adversary-selftest:
    # 恶意合规 adversary 自测（W4-C2 .github#221 / ADR-0067 决策 2/3，宪法 §4E
    # 判定物有效性）：零真实 LLM 调用（--replay-file 回放）——T1 配置锁（prompt
    # hash 一致+篡改负控制+AR-8 跨族断言）、T2 弱套件 e2e（退化实现真全绿 →
    # exit 1 blocking + 钻洞归因）、T3 强套件 e2e（五类攻击全败 → exit 0 + 尝试
    # 记录留痕）、T4 恒绿防御（白卷 → exit 3）、T5 计量约定（role=adversary 落账）。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PyYAML（adversary-config / attack-strategies / 角色档表解析）
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.3
      - name: adversary 自测 T0-T5
        run: bash pipeline/adversary/tests/run-tests.sh
      - name: expected-skip 自测 E0-E7（W4-C3 #284）
        # 豁免谓词 judge 面 + 豁免清单 + exemption_sha 留痕——2026-08 接口漂移
        # （PR #87 代码 vs #88 测试）曾致 10/13 断言红而 CI 不跑漏检，故常驻本 job。
        run: bash pipeline/adversary/tests/test-expected-skip.sh
      - name: check-run-writeback 自测 W0-W4（W4-C2 #283）
        # verdict→check run 映射/截断/定位与令牌解析（纯逻辑 + CLI 负向）。
        run: bash pipeline/adversary/tests/test-check-run-writeback.sh
      - name: intent-backstop 自测 I0-I3（W4-C4 #285）
        run: bash pipeline/adversary/tests/test-intent-backstop.sh

  entropy-selftest:
    # 语义熵分歧度量自测（W4-C1 .github#220 / ADR-0066 决策 3，宪法 §4E 判定物
    # 有效性）——零真实 LLM（fixture 回放经计量 wrapper 落账，与 live 同构）：
    # AC-1 e2e 歧义定位 INV-2 + 措辞差异不误报（语义聚簇）、AC-2 底噪扣减
    # （B 记录在案；3−2 不报/4−2 报 + e2e B=2 抑制）、AC-3 质询结构化
    # （spec 原文引用+条款坐标）与轮次硬上限、AC-4 判定链零 LLM 静态断言
    # （import 面黑名单 + k 路族标记/各族>=1 路）+ 反投票铁律。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 语义熵 fixture 自测（AC-1~AC-4）
        run: python3 -m unittest discover -s pipeline/entropy/tests -v

  bugflow-selftest:
    # bug 流水线自测（W3-C1 .github#218 / ADR-0064，宪法 §4E 验证器之验证）：
    # 三值判定（reproduced/cannot-reproduce/inconclusive→重试→needs-human）、
    # 哨兵自证 fail-closed（基线不绿/哨兵不红/日志缺失=拒绝判定）、同指纹去重
    # 幂等、env-gate 不匹配≠证伪、周抽样确定性——零真实 LLM、零网络、零写库。
    # run-tests.sh 同时是 bug-reproduce.yml 每次判定的基线自证资产（执法前
    # 先证明自己没坏）。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bugflow 自测 T1-T10
        run: bash pipeline/bugflow/tests/run-tests.sh

  holdout-unseal-selftest:
    # holdout 揭封 gate 自测（W4-C3 .github#222 / ADR-0068）：sealed_sha256 红/绿、计数化
    # 输出（stdout 零明细黑名单）、通过率差 >5% exit 1 / ≤5% exit 0、无凭据 fail-closed。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 揭封 gate 自测（含 gate 内 pytest runner 安装）
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pytest==8.4.2
          python3 -m unittest discover -s pipeline/holdout-unseal/tests -v

  attestation-selftest:
    # 签名证据包 v0 自测（IR-0006 W4-R3 / .github#420 / SC-4 / AC-8e/8f）：
    # 产物 digest 复算 + SBOM 逐文件重算 + RS256 验签 + commit/card 回溯锚——
    # 正向全链绿；负向五类篡改（产物/SBOM/attestation/错公钥/缺件）逐项必红。
    # 零网络零真实仓：openssl 一次性密钥对 + fixture tar.gz。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: attestation 自测 T1-T6
        run: bash pipeline/attestation/selftest/run-selftest.sh

  trust-gate-selftest:
    # 信任门自测（W5-C2 .github#225 / ADR-0071，宪法 §5——替代 spec v3 risk-score）：
    # 硬谓词白名单判定（每域每证据谓词键逐个缺失断言——缺证据=拒绝不是中性）、
    # 熔断前置 fail-closed（ADR-0040 联动）、排除域永远人签、shadow 决策记录
    # （executed=false）+ owner 裁决比对（一致/逃逸/陷阱三类）+ 解锁判定边界
    # （49/50、逃逸重置、陷阱放行重置、陷阱占比 <10% 不解锁）+ 5% 抽审确定性
    # （种子可注入）+ CLI 端到端链路——零 LLM、零网络。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trust-gate 自测（AC-1~AC-4）
        run: python3 -m unittest discover -s pipeline/trust-gate/tests -v

  gate:
    if: always()
    needs: [hygiene, test-integrity-selftest, metering-selftest, adversary-selftest, entropy-selftest, bugflow-selftest, holdout-unseal-selftest, attestation-selftest, trust-gate-selftest]
    runs-on: ubuntu-latest
    timeout-minutes: 5    # testing.yaml "gate<5min" 原则的硬上限
    permissions:
      pull-requests: read   # job 级最小权限（coderabbit review：本 job 无 checkout，
                            # pulls/files API 仅需 pull-requests:read——不留多余 contents:read）
    steps:
      - name: All required jobs green?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          # 严格断言（P1-3 .github#84 / ADR-0032）：skipped≠success——本仓上游无事件
          # 条件 job（两种事件都须真跑），无结构性预期跳过，非 success 一律红
          if echo "$NEEDS" | jq -e '[to_entries[] | select(.value.result != "success")] | length > 0' >/dev/null; then
            echo "::error::上游 job 未通过（skipped≠success：严格断言，非 success 一律红——ADR-0032）"; exit 1
          fi

      # adr-required（红队二批 ADR-0016 决策 1：README「修改规则」声明本检查但此前
      # 无实现——声执不一致。对齐 .github gate.yml 同模型）：
      # 本仓整体即 C1 治理资产（全部 workflow 被业务仓 @v1 消费、README/zizmor 是治理声明）。
      # 被引 ADR 的存在性不在 PR 上下文做：决策落盘在公开仓 archive/adr/（ADR-0085
      # 家园单仓化），存在性由 .github drift-check.sh §10 每日后验。
      - name: adr-required（C1 变更须引用 ADR）
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # 文件清单三防线（qodo review #2 #3 + 追加：换行文件名绕过）：
          # 分页拉全量；rename 的 previous_filename 一并纳入 C1 判定（C1 资产改名
          # 移出受管路径同样是 C1 变更）；files API 3000 文件硬上限 fail-closed。
          # 计数与 C1 匹配全部在 jq 内按 JSON 对象处理——Git 允许文件名含换行，
          # 行流（grep -c / echo|grep）会被单文件多行虚增计数绕过截断检测
          # （qodo review：Newline filenames bypass truncation，AR#22 同款）。
          PR_API="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
          CHANGED=$(gh api "$PR_API" --jq '.changed_files')
          GOT=0
          C1_HIT=0
          PAGE=1
          while :; do
            PAGEJSON=$(gh api "$PR_API/files?per_page=100&page=$PAGE")
            if ! jq -e 'type == "array"' <<<"$PAGEJSON" >/dev/null 2>&1; then
              echo "::error::files API 第 $PAGE 页拉取失败——C1 判定完整性无法保证，fail-closed"
              exit 1
            fi
            N=$(jq 'length' <<<"$PAGEJSON")
            GOT=$((GOT+N))
            if jq -e '[.[] | .filename, (.previous_filename // empty)]
                     | any(test("^(\\.github/|zizmor\\.yml|README\\.md|CODEOWNERS)"))'                <<<"$PAGEJSON" >/dev/null 2>&1; then
              C1_HIT=1
            fi
            [[ $N -lt 100 ]] && break
            PAGE=$((PAGE+1))
          done
          if [ "$GOT" -lt "$CHANGED" ]; then
            echo "::error::PR 声明变更 $CHANGED 个文件但 files API 只返回 $GOT 个（3000 上限截断）——C1 判定完整性无法保证，fail-closed"
            exit 1
          fi
          if [ "$C1_HIT" -ne 1 ]; then
            echo "非 C1 路径变更，跳过 adr-required"
            exit 0
          fi
          # 词边界：NOTADR-0016junk 之类子串不得满足 ADR 引用要求
          ADR_RE='\bADR-[0-9]{4}\b'
          if { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -qE "$ADR_RE"; then
            echo "OK adr-required: $( { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -oE "$ADR_RE" | sort -u | tr '\n' ' ')（存在性后验：.github drift-check §10）"
          else
            echo "::error::C1 路径变更但 PR 未引用任何 ADR-NNNN（README 修改规则：本仓变更属 C1 治理路径，须引用 ADR——落盘 archive/adr/，ADR-0085）"
            exit 1
          fi
