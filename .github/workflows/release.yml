name: release
on:
  workflow_call:
    inputs:
      runtime: { type: string, default: "none" }
      artifacts: { type: string, default: "dist/**" }

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: |
          make setup
          make build
      - name: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.artifacts }}
      - name: gh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            $(ls -d ${{ inputs.artifacts }} 2>/dev/null || true)
