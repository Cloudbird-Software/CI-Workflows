name: release
on:
  workflow_call:
    inputs:
      runtime: { type: string, default: "none" }
      artifacts: { type: string, default: "dist/**" }

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: |
          make setup
          make build
      - name: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ inputs.artifacts }}
      - name: gh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            $(ls -d ${{ inputs.artifacts }} 2>/dev/null || true)
