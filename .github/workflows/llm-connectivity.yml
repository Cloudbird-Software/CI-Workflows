name: llm-connectivity
# ASSUMPTION-01 监控（IR-0001 W0-C1 / ADR-0048）：GitHub-hosted runner 到
# provider API 的可达性 + org secret LLM_API_KEY 有效性。红 = provider 不可达
# 或 key 失效（spec 要求失败开 issue——本 workflow 先以红 run 告警，
# issue 化随 conductor 事件面在后续波次接入）。
#
# 出向白名单（INV-06 第一期形态）：仅 github 域 + provider 域名
# （harden-runner egress-policy block——白名单外一律阻断，含 DNS 探测类）。
on:
  workflow_dispatch:
    inputs:
      model:
        { description: "探测用 provider 模型名", type: string, default: "glm-4.5-air" }
  schedule:
    - cron: "17 */6 * * *"   # 每 6h；非整点分钟避开 GitHub 调度洪峰

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 出向白名单（仅 github + provider，INV-06）
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-urls:
            - github.com
            - api.github.com
            - objects.githubusercontent.com
            - open.bigmodel.cn
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 最小调用（max_tokens=16 + thinking disabled，经计量 wrapper）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROBE_MODEL: ${{ inputs.model || 'glm-4.5-air' }}
        run: |
          printf 'connectivity probe' > /tmp/p.txt
          reply=$(bash scripts/llm-call.sh --model "$LLM_PROBE_MODEL" \
            --prompt-file /tmp/p.txt --max-tokens 1 --temperature 0 --tag connectivity)
          echo "reply(≤200B): ${reply:0:200}"
      - name: usage 记录入 run 摘要（BEH-09 留痕）
        run: |
          f=$(ls -1 llm-usage/usage-*.json | head -1)
          {
            echo "## llm-connectivity usage"
            echo '```json'
            cat "$f"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$f"
