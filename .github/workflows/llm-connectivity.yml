name: llm-connectivity
# ASSUMPTION-01 监控（IR-0001 W0-C1 / ADR-0048）：GitHub-hosted runner 到
# provider API 的可达性 + org secret LLM_API_KEY 有效性。红 = provider 不可达
# 或 key 失效（spec 要求失败开 issue——本 workflow 先以红 run 告警，
# issue 化随 conductor 事件面在后续波次接入）。
#
# 出向白名单（INV-06 第一期形态）：仅 github 域 + provider 域名
# （harden-runner egress-policy block——白名单外一律阻断，含 DNS 探测类）。
# W2-C3（.github#216，ADR-0062）：调用改经计量 wrapper 完整版（pipeline/metering/
# ——invoke 聚合 + hash 链），并把本 run 计量账本同步到 metering-ledger 分支
# （cost-check LLM 预算通道数据源）。
on:
  workflow_dispatch:
    inputs:
      model:
        { description: "探测用 provider 模型名", type: string, default: "glm-4.5-air" }
  schedule:
    - cron: "17 */6 * * *"   # 每 6h；非整点分钟避开 GitHub 调度洪峰

permissions:
  contents: read

concurrency:
  group: llm-connectivity
  cancel-in-progress: false   # 账本同步不并发（409 冲突由重跑续接，错峰更稳）

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # job 级授权（顶层仍最小读）：contents:write 仅为账本同步步骤推
    # metering-ledger 分支所需（同仓 GITHUB_TOKEN）；probe 调用本身只读
    permissions:
      contents: write
    steps:
      - name: 出向白名单（仅 github + provider，INV-06）
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # 块标量修复：原 allowlist 缺 | 被 YAML 折叠为单行——harden-runner 策略
          # 从未实际生效（假绿）。audit 模式：block 在本 org 实测拦 git fetch（见
          # adversary.yml 2026-08-24 偏离记录），连通性探测用检测不阻断。
          egress-policy: audit
          allowed-endpoints: |
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            api.kimi.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # 账本同步走显式 GH_TOKEN 的 contents API，不落 git 凭据
      - name: 最小调用（max_tokens=128 + thinking disabled，经计量 wrapper 完整版——W2-C3/ADR-0062）
        env:
          # 2026-08-24：org secret LLM_API_KEY 已随供应商切换删除（只剩 KEY1=kimi）——
          # 本 workflow 曾因此连续红（secret 缺失）。endpoint/model 走 org vars。
          # 2026-08-31：max_tokens 16→128——StepFun step-3.7-flash 常开推理
          # （reasoning_effort 低档仍先产思维链），16 tokens 下 completion 全被
          # 思维链吃空、content 恒空，计量 fail-closed 误报 infra 红。
          LLM_API_KEY: ${{ secrets.LLM_API_KEY1 }}
          LLM_BASE_URL: ${{ vars.LLM_ENDPOINT1 }}
          LLM_PROBE_MODEL: ${{ inputs.model || vars.MODEL1 }}
        run: |
          printf 'Reply with exactly one word: OK' > /tmp/p.txt
          reply=$(bash pipeline/metering/metering-wrapper.sh --model "$LLM_PROBE_MODEL" \
            --prompt-file /tmp/p.txt --max-tokens 128 --temperature 0 --thinking disabled \
            --role probe --tag connectivity --usage-compat-dir llm-usage)
          echo "reply(≤200B): ${reply:0:200}"
      - name: usage 记录入 run 摘要（BEH-09 留痕）
        run: |
          f=$(ls -1 llm-usage/usage-*.json | head -1)
          {
            echo "## llm-connectivity usage"
            echo '```json'
            cat "$f"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$f"
      - name: 计量账本验链 + 同步（metering-ledger 分支——cost-check LLM 预算通道数据源，ADR-0062）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash pipeline/metering/metering-verify.sh --dir .metering
          bash pipeline/metering/ledger-sync.sh --dir .metering --branch metering-ledger
