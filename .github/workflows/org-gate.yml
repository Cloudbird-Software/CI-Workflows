name: org-gate
# 组织级 required workflow（P3-1 #95 / ADR-0046）——gate 审判逻辑的唯一真源。
# 触发方式：org ruleset `org-required-workflows`（required workflows 在各受管仓
# 的 pull_request/push 上自动运行本文件；本文件自身的 on: 不参与触发）。
# 运行上下文 = 被审仓库（GITHUB_TOKEN/checkout/审计面均属被审仓）——被审 PR
# 改不到这里的审判逻辑（#81 §3.3：PR 自我削弱路径关闭）。
#
# 结构：org-hygiene（复用本仓 hygiene.yml@钉 SHA，扫描被审仓；job 名带 org- 前缀防与被审仓本地 check 名冲突）→ org-adr-required（C1
# 路径变更须引用真实 ADR，路径集=组织 C1 ∪ 业务仓 C1 保守并集）→ gate（严格
# 聚合器 + 双轨比对注记）。升级钉点须走本仓版本发布流程（ADR-0046 决策 5）。

# 平台约束（ruleset API 实测）：required workflow 的文件必须声明
# pull_request / pull_request_target / merge_queue 触发器之一（本文件的触发器
# 只为满足该约束——真正的调用方是 org ruleset；在中心仓自身触发的运行被下方
# job 级守卫跳过，防自测重复）
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  org-hygiene:
    # 中心仓自身的 PR 会因 on: pull_request 触发本 workflow——跳过防重复
    # （中心仓自有 ci.yml 自测；ruleset 不作用于 CI-Workflows 自身）
    if: github.repository != 'Cloudbird-Software/CI-Workflows'
    # 钉 commit hash（zizmor unpinned-uses；hash=本仓 main b43f5911，含 hygiene.yml
    # 现行版）；hygiene 在被审仓上下文运行——checkout/扫描对象=被审仓库
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/hygiene.yml@b43f5911059098175b0819c8c309c493674aa2c3

  org-adr-required:
    # C1 路径变更须引用 ADR（与 .github 仓 gate.yml / 各业务仓 ci.yml 的 adr-required
    # 同语义，但本文件在中心仓——被审 PR 无法掏空）。路径集=组织 C1 ∪ 业务仓 C1
    # 保守并集（ADR-0046 决策 1）；分叉按 T3 观察期流程归因。
    if: github.event_name == 'pull_request' && github.repository != 'Cloudbird-Software/CI-Workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: C1 变更须引用真实 ADR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_API: "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"   # zizmor：模板值经 env 间接引用
        run: |
          CHANGED=$(gh api "$PR_API" --jq '.changed_files')
          GOT=0
          C1_HIT=0
          PAGE=1
          while :; do
            PAGEJSON=$(gh api "$PR_API/files?per_page=100&page=$PAGE")
            if ! jq -e 'type == "array"' <<<"$PAGEJSON" >/dev/null 2>&1; then
              echo "::error::files API 第 $PAGE 页拉取失败——C1 判定完整性无法保证，fail-closed"
              exit 1
            fi
            N=$(jq 'length' <<<"$PAGEJSON")
            GOT=$((GOT+N))
            # fail-closed（实测教训：正则单反斜杠致 jq 编译错误被吞→静默按非 C1 跳过）：
            # 编译/求值错误（exit 5 等）显式判红，只有明确求值结果才进分支。
            # bash -e 语义（agent-registry PR#65 实测）：jq -e 对 false 结论退出 1——
            # 裸赋值后取 $? 会在 -e 下直接灭脚本（非 C1 PR 静默死），必须 || RC=$? 捕获
            RC=0
            VERDICT=$(jq -e '[.[] | .filename, (.previous_filename // empty)]
                     | any(test("^(governance/|standards/|scripts/|\\.github/|CODEOWNERS|profile/|AGENTS\\.md|Makefile|docs/|zizmor\\.yml|\\.dependency-cruiser\\.cjs)"))' <<<"$PAGEJSON" 2>/tmp/c1regex.err) || RC=$?
            if [[ $RC -gt 1 ]]; then
              echo "::error::C1 正则求值失败（jq exit $RC）：$(head -1 /tmp/c1regex.err)——fail-closed"; exit 1
            fi
            [[ "$VERDICT" == "true" ]] && C1_HIT=1
            [[ $N -lt 100 ]] && break
            PAGE=$((PAGE+1))
          done
          if [ "$GOT" -lt "$CHANGED" ]; then
            echo "::error::PR 声明变更 $CHANGED 个文件但 files API 只返回 $GOT 个（3000 上限截断）——fail-closed"
            exit 1
          fi
          if [ "$C1_HIT" -ne 1 ]; then
            echo "非 C1 路径变更，跳过 adr-required"
            exit 0
          fi
          ADR_RE='\bADR-[0-9]{4}\b'
          if ! { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -qE "$ADR_RE"; then
            echo "::error::C1 路径变更但 PR 未引用任何 ADR-NNNN（org-gate 中心执法，ADR-0046）"
            exit 1
          fi
          # ADR 家园迁移（ADR-0053 框架 → ADR-0085 收口）：正本+INDEX 统一落
          # archive/adr/（agent-registry 退役后 decisions/ 不再是 ADR 真源）。
          # PR head 新增 ADR 走同一目录前缀 adr/。
          ADR_LISTING=$(gh api "repos/Cloudbird-Software/archive/contents/adr?per_page=100" --paginate --jq '.[].name' 2>/dev/null)
          if [[ -z "$ADR_LISTING" ]]; then
            echo "::error::archive/adr 清单拉取失败——ADR 存在性无法校验（fail-closed）"
            exit 1
          fi
          # 补充 PR 自身新增的 ADR 文件（新增 ADR 在合入前不在 main 分支清单中——仅靠
          # 主线清单会误判幽灵 ADR；PR head 的 adr/ 文件同样计入存在性校验）。
          PR_ADR_LISTING=$(gh api "$PR_API/files?per_page=100" --paginate \
            --jq '.[] | select(.filename | startswith("adr/")) | .filename | capture("^adr/(ADR-[0-9]{4}-[^/]+)$") | .captures[0].string' 2>/dev/null)
          ADR_LISTING=$(printf '%s\n%s' "$ADR_LISTING" "$PR_ADR_LISTING" | grep -v '^$' | sort -u)
          MISSING=0
          for ref in $( { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -oE "$ADR_RE" | sort -u ); do
            num="${ref#ADR-}"
            grep -q "^ADR-${num}-" <<<"$ADR_LISTING" || {
              echo "::error::引用的 ${ref} 在 archive/adr/（含 PR head）无对应文件（幽灵 ADR）"; MISSING=1; }
          done
          exit $MISSING

  org-gate:
    # 严格聚合器（ADR-0032：skipped≠success，仅 success 放行）+ 双轨比对注记（T3 观察期数据积累）。
    # v1.4.2 EXPECTED_SKIP（#135）：org-adr-required 是事件条件 job（仅 PR 事件跑），
    # merge_group 下设计性 skip——聚合器须显式豁免，否则 merge queue 全量弹回；
    # 其余任何 skip 仍红（豁免白名单只有这一个 key + 只在 merge_group 事件）。
    if: always() && github.repository != 'Cloudbird-Software/CI-Workflows'
    needs: [org-hygiene, org-adr-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: All required jobs green?（严格断言 + EXPECTED_SKIP）
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}   # zizmor：模板值经 env 间接引用
        run: |
          echo "$NEEDS"
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            OK=$(echo "$NEEDS" | jq -r 'to_entries | all(.value.result == "success" or (.key == "org-adr-required" and .value.result == "skipped"))')
          else
            OK=$(echo "$NEEDS" | jq -r 'to_entries | all(.value.result == "success")')
          fi
          if [[ "$OK" != "true" ]]; then
            echo "::error::org-gate 上游未全绿（skipped≠success：严格断言——ADR-0032/0046；merge_group 下 org-adr-required 设计性 skip 豁免，v1.4.2/#135）"; exit 1
          fi
      - name: 双轨比对注记（T3 观察期）
        # 观察期数据：本地 gate（旧轨）与中心 org-gate（新轨）结论不一致时发
        # warning 注记（不改变判定）——连续 PR 的比对数据用于退役旧轨的验收。
        # 本地 gate 未完结/未上报时静默（avoid 竞态噪音）。
        if: github.event_name == 'pull_request' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          CR_API: "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs"   # zizmor：模板值经 env 间接引用
        run: |
          LOCAL=$(gh api "$CR_API" \
            --jq '[.check_runs[] | select(.name == "gate") | .conclusion] | first // empty' 2>/dev/null || true)
          if [[ -n "$LOCAL" && "$LOCAL" != "success" ]]; then
            echo "::warning::双轨分叉（T3 观察期数据）：本地 gate=$LOCAL 而 org-gate=success——须归因后才能退役旧轨（ADR-0046 决策 3）"
          elif [[ -n "$LOCAL" ]]; then
            echo "双轨一致：本地 gate=$LOCAL，org-gate=success"
          fi
