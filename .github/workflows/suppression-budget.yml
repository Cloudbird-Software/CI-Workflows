name: suppression-budget
# P2-2 抑制标记预算门（ADR-0036 / .github #87）：单 PR 净增阈值（≤3）+ 合入树
# 总量棘轮（不得高于 policy 基线）+ ADR 逃生门（豁免入账）。
#
# 业务仓接入（ADR-0036 修订：分发载体从 check.yml 内嵌 job 改为独立 reusable——
# 实测 job 内嵌于 check.yml 时整个 workflow 的 action 解析故障（"Unable to resolve
# action harden-runner"，v1.5.1 实证、v1.5.0 同文件无 job 正常，二分定位；独立
# 文件同构于 test-integrity.yml 无此问题）。判定语义与 ADR-0036 原设计一致）：
#   suppression-budget:
#     uses: Cloudbird-Software/CI-Workflows/.github/workflows/suppression-budget.yml@<钉住 ref>
#     with:
#       detector-ref: <与 uses: 的 pin 同值的 40 位 SHA>
#   gate:
#     needs: [..., suppression-budget]
# 非 PR 事件 n/a-success（推送面无 PR diff 语义——ADR-0032/0035 同款，调用方 gate
# 无需登记 EXPECTED_SKIP）。
#
# 门禁三要素均来自被审 PR 改不动的位置（#81 §3.3）：
#   1. workflow 本体——caller 钉住 ref 引用本文件；
#   2. 执法工具与 policy——caller 以 detector-ref 输入（= uses: 的 pin）checkout
#      CI-Workflows 同源副本（github.workflow_ref 在 reusable 上下文解析为 caller
#      自身 ref，不可用于钉源——ADR-0043/#21 实测，显式输入是唯一可靠机制）；
#   3. 阈值/基线——policy/suppressions.yaml 与检测器同 ref 三耦合。
on:
  workflow_call:
    inputs:
      detector-ref:
        type: string
        default: ""   # 检测器来源（CI-Workflows 的 commit SHA）——必须与 uses: 的 pin 同值；
                       # 空=红（fail-closed）

permissions: {}   # 顶层零权限默认；job 级显式最小权限

jobs:
  suppression-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # testing.yaml "gate<5min" 原则的硬上限
    permissions:
      contents: read   # 双仓只读 checkout（caller 合入树 + CI-Workflows 检测器/policy）+ GITHUB_TOKEN 拉 PR diff
    steps:
      - name: 非 PR 事件（n/a-success）
        if: github.event_name != 'pull_request'
        run: echo "::notice::suppression-budget 只对 pull_request 事件判定——本事件 n/a（success），无需 EXPECTED_SKIP 登记（ADR-0032/0036）"

      - name: Harden Runner (egress audit)
        if: github.event_name == 'pull_request'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85b0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout 调用仓（PR 合入树——总量维度计数面）
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 检测器来源钉定守卫（fail-closed）
        if: github.event_name == 'pull_request'
        env:
          DETECTOR_REF: ${{ inputs.detector-ref }}
        run: |
          set -eu
          [ -n "$DETECTOR_REF" ] || { echo "::error::suppression-budget detector-ref 输入为空——检测器来源未钉（ADR-0036 fail-closed）"; exit 1; }
          echo "检测器来源 = CI-Workflows@$DETECTOR_REF（须与 uses: 的 pin 同值）"

      - name: Checkout 检测器与 policy（CI-Workflows 同 ref，不取 caller 仓内副本）
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Cloudbird-Software/CI-Workflows
          ref: ${{ inputs.detector-ref }}
          path: ciw-sup
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          python-version: "3.12"

      - name: 安装钉哈希依赖（PyYAML，与 requirements-test-integrity.txt 同锚）
        if: github.event_name == 'pull_request'
        run: pip install -q --require-hashes -r ciw-sup/.github/requirements-test-integrity.txt

      - name: T1–T6 自测（执法前 fixture 校验——44 断言，工具自身算错比漏检更糟）
        if: github.event_name == 'pull_request'
        run: bash ciw-sup/scripts/suppression-budget-selftest.sh

      - name: 取 PR diff / 标题 / 正文（pulls API）
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUM" -H "Accept: application/vnd.github.diff" > pr.diff
          test -s pr.diff || { echo "::error::suppression-budget: PR diff 拉取为空（fail-closed）"; exit 1; }
          printf '%s' "$PR_TITLE" > pr-title.txt
          gh api "repos/$REPO/pulls/$PR_NUM" --jq '.body // ""' > pr-body.txt

      - name: 取 ADR 清单（agent-registry decisions——逃生门存在性/scope 判定）
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Cloudbird-Software/agent-registry
          sparse-checkout: decisions
          path: adr-src
          persist-credentials: false

      - name: suppression-budget（P2-2 抑制标记预算门）
        if: github.event_name == 'pull_request'
        env:
          REPO_NAME: ${{ github.event.repository.name }}   # zizmor：模板值经 env 间接引用，不内插进命令
        run: |
          bash ciw-sup/scripts/suppression-budget.sh \
            --repo "$REPO_NAME" \
            --diff pr.diff \
            --tree . \
            --policy ciw-sup/policy/suppressions.yaml \
            --pr-title "$(cat pr-title.txt)" \
            --pr-body pr-body.txt \
            --adr-dir adr-src/decisions
