schema: verifier-rubric/v1
id: ai-readability
version: "1.0.0"
# AI 可读性 rubric 契约（W5-C3 .github#226 / ADR-0072 决策 5；宪法 §4C T2 检查项①）。
# 判据分解+每档锚定描述；连续分 [0,1]（G-Eval 连续分范式 arXiv:2303.16634——禁离散印象分）。
# shadow 纪律：本 rubric 出分仅记录不阻断（blocking:false）；升 veto 走 §5 信任门，本文件不授权。
scoring: 连续分 [0,1]，按锚定描述取最近档再插值；判官须引用所依据的锚档
dimensions:
  - id: locatability
    zh: 可定位性
    question: 从 AGENTS.md/index 出发找到目标符号/资产入口的容易度
    anchors:
      "0.0": 无任何入口文档，只能全库盲搜
      "0.25": 有 README 但不含结构索引，定位依赖文件名猜测
      "0.5": README/AGENTS.md 有目录级索引，但条目与实际路径常有出入
      "0.75": 索引准确覆盖主要资产，少数新增资产滞后
      "1.0": 索引准确且含维护责任与变更指引，任意符号两跳内可达
  - id: entry_clarity
    zh: 入口清晰度
    question: index 出口是否准确反映内部能力（不多报、不漏报）
    anchors:
      "0.0": 索引宣称的能力多数不存在或早已移除
      "0.25": 能力条目存在但指向的入口路径半数失效
      "0.5": 主要入口可用，次级能力需读源码确认存在
      "0.75": 出口与能力基本一一对应，个别表述含糊
      "1.0": 每个能力条目都有可执行入口+期望行为，无幽灵能力
  - id: module_depth
    zh: 模块深度充分性
    question: 接口是否真把复杂度挡在门内（调用方无需了解内部细节）
    anchors:
      "0.0": 接口直接暴露内部数据结构，改动必然波及调用方
      "0.25": 接口薄壳，关键路径仍要求调用方组装内部步骤
      "0.5": 常用路径有合格抽象，边界场景漏出实现细节
      "0.75": 抽象完整，仅个别逃生舱（hatch）要求内部知识
      "1.0": 复杂度完全内化，接口语义自足且带失败契约
  - id: naming_vocabulary
    zh: 命名词表一致性
    question: 文件/符号/配置命名是否遵循统一词表（同物同名、异物异名）
    anchors:
      "0.0": 同一概念多种叫法混用，无命名约定痕迹
      "0.25": 约定存在但违反率目测过半
      "0.5": 主流命名一致，历史遗留混入同义词
      "0.75": 命名高度一致，仅极少数豁免未记录
      "1.0": 词表显式成文（如 side-effects.yaml），命名与词表可机器对账
  - id: example_freshness
    zh: 示例与文档新鲜度
    question: 示例/文档是否与当前代码行为一致（陈旧示例=负资产）
    anchors:
      "0.0": 无示例，或示例引用的接口已不存在
      "0.25": 示例存在但落后接口一个大版本
      "0.5": 示例可运行但输出与文档描述有出入
      "0.75": 示例与代码同步维护，个别参数未更新
      "1.0": 示例进 CI 定期执行（示例即测试），漂移即红
annotation_debt_policy: |
  数据不足的维度必须显式申报 annotation_debt（哪些维度当前数据不足=负债），
  不许静默打分。负债清偿=补齐该维度的数据源/标注预算（ADR-0072 决策 6：
  标注负债申报制，未配预算不许从 T3 迁移）。
