version: 1
# 角色档 → provider 模型解析表（IFACE-06 第一期，ADR-0048 决策 3 / ADR-0050）
# - 版本化资产：改动走 PR（C1）；agent 声明仍只引用角色档，不直写模型名
# - alias 语义与族级独立性（AR-8）以本表为准——原 registry/models.yaml 随 ADR-0085 退役
# - thinking: GLM 4.5+ 为推理模型——非 reasoning 场景必须 disabled，否则正文
#   被思维链吃掉且计量口径失真（连通性实测教训，CI-Workflows PR#30）
roles:
  spec-author:
    model: glm-4.5-air
    max_tokens: 8192
    temperature: 0.2
    thinking: disabled
    use_for: [spec 起草]
  probe:
    # llm-connectivity 专用（ASSUMPTION-01 监控）
    model: glm-4.5-air
    max_tokens: 16
    temperature: 0
    thinking: disabled
    use_for: [连通性探测]
  judge-deep:
    # 恶意合规 adversary 专用档（W4-C2 .github#221，ADR-0067）：第三族
    # alias——family=sovereign-family，≠ builder(coder-fast=flash-family)
    # ≠ test-author(reviewer=flagship-family)，AR-8 跨族分离。锁定参数与
    # pipeline/adversary/adversary-config.yaml 交叉断言（漂移即 adversary exit 2）
    model: step-3.7-flash  # 阶跃星辰 Step Plan（2026-08-31，ADR-0104：sensenova 通道 429 退役）
    # 16384→49152（ADR-0104 后续校参）：StepFun 常开推理先耗预算，16384 截断
    # 攻击响应（与 adversary-config.yaml 交叉断言同步）
    max_tokens: 49152
    temperature: 0.2
    thinking: disabled
    use_for: [恶意合规 adversary]
