version: 1
# 状态机转移表（IR-0001 IFACE-03 / ADR-0049）——conductor 唯一定义源，
# 只解释不内嵌逻辑。本文件是 C1 资产：改动走 PR+ADR。
#
# schema：
#   from_state  = 转移前状态（当前 issue 无 state:* 标签时视为 ir-draft）
#   event       = label:state:<name> | comment:/start | comment:/claim | comment:/retry
#                 | label:<非state判定标签>（W3-C1 Bug 流扩展：label:bug/label:reproduced
#                 ——判定标签驱动的转移，见 B1/B2 注）
#   to_state    = 转移后状态（conductor 以 App 身份换标签：移除 from、置上 to）
#   action      = invoke:spec-author | claim | noop（W0 全集）
#   guard       = 布尔表达式；变量白名单：sender_role（owner|agent|none）、
#                 author_association（OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR|NONE）、
#                 label_set（当前标签名集合）
#   deterministic_predicates = 可选；conductOR 须在放行前重新断言的确定性谓词列表
#                 （AC-12：T5/T6 全部前置条件由 conductor 侧重新断言，不信任 dispatch/标签载荷）。
#                 每条含 id / description / fail_closed；target 视谓词指向工件。
# 未列出的 (from_state, event) 组合 = 禁止转移（conductor no-op；重复投递/
# 跳态/反向天然被 from_state 匹配拒绝——幂等键 {issue, from, to} 的落盘形态）。
# W3-C1（ADR-0064）：append bug 流状态 bug/reproduced/fixed 与转移 B1-B5。
# Bug 流与 Feature 流的差异：入口免签（bug 标签即 reproduce 阶段）、
# 判定标签（reproduced/cannot-reproduce/inconclusive）是事实标签而非状态——
# cannot-reproduce 不产生状态转移（保留人裁，ADR-0064 决策 4）；
# bugflow 的状态写序=先移旧态再置新态（防双 state 并存窗口触发
# conductor 多状态 abort）。
# W4-C1（ISSUE-263 AC-12）：T5/T6 追加 deterministic_predicates（suite 就绪谓词 +
# 三元组 survived 审计记录），conductor.yml 在路由放行前重新断言。
states: [ir-draft, ir-signed, spec, redteam, wave-planned, ready, in-progress, quarantine, needs-human, done, bug, reproduced, fixed]

transitions:
  - id: T1  # 主通路：owner/agent 打签署标签 → 进 spec 阶段（BEH-01）。
    # from_state=ir-signed：label 事件送达时签署标签已生效（当前态即 ir-signed）——
    # 首版误写 ir-draft 导致必然 no-op（#143 实测 AUDIT: from=ir-signed verdict=noop）。
    # 守卫不过=回退该标签（退回 ir-draft）；幂等：已在 spec 态则无匹配=no-op。
    from_state: ir-signed
    event: label:state:ir-signed
    to_state: spec
    action: invoke:spec-author
    guard: "sender_role in ['owner', 'agent'] and 'type:intent' in label_set"
  - id: T2  # owner 评论 /start 等价签署（AC-1 的 comment 路径）
    from_state: ir-draft
    event: comment:/start
    to_state: spec
    action: invoke:spec-author
    guard: "sender_role == 'owner' and 'type:intent' in label_set"
  - id: T3  # 认领：先到先得（当前态必须 ready，否则 no-op）（BEH-08）
    from_state: ready
    event: comment:/claim
    to_state: in-progress
    action: claim
    guard: "sender_role == 'agent' or author_association in ['OWNER', 'MEMBER', 'COLLABORATOR']"
  - id: T4  # 隔离重判（BEH-07 的 /retry 回流）
    from_state: quarantine
    event: comment:/retry
    to_state: ready
    action: noop
    guard: "sender_role in ['owner', 'agent']"
  - id: T5  # spec PR 合并 + suite 就绪后进入红队阶段（ISSUE-263 AC-12 / ADR-0049）
    # W4-C1（AC-12）：除 guard 外，conductor 须在放行前重新断言 suite-ready 谓词
    # （确定性：suite/ 存在 + 含非空测试文件 + 文件可解析），不信赖标签/dispatch 载荷。
    from_state: spec
    event: label:state:redteam
    to_state: redteam
    action: noop
    guard: "sender_role in ['owner', 'agent'] and 'type:intent' in label_set"
    deterministic_predicates:
      - id: suite-ready
        description: |
          suite 就绪=确定性谓词：该卡 spec 下 suite/ 目录存在、含至少一个非空测试文件、
          且全部测试文件可被 python ast.parse 解析（可解析）。任一不满足即 fail-closed 拒转。
        fail_closed: true
  - id: T6  # redteam 产出 survived 审计记录后进入波次规划（ISSUE-263 AC-12 / ADR-0079）
    # W4-C1（AC-12）：进入 wave-planned 须存在该卡本次生命周期内、
    # 卡 ID + specVersion + 审计 run ID 三元组对应的 survived 审计记录；
    # 禁止跨卡 / 历史记录短路（survived 必须是本卡本 specVersion 本次审计的 run）。
    # needs-human 不可直跳 wave-planned（B5 之外的 needs-human → wave-planned 无转移定义 = 永拒）。
    from_state: redteam
    event: label:state:wave-planned
    to_state: wave-planned
    action: noop
    guard: "sender_role == 'agent' and 'adversary:survived' in label_set"
    deterministic_predicates:
      - id: triplet-survived
        description: |
          三元组 survived 审计记录存在性：该卡（卡 ID）本次生命周期内、匹配
          card 绑定 specVersion + 审计 run ID 的 survived 审计记录必须存在。
          跨卡记录、历史记录、其它 specVersion 记录均不计入（fail-closed）。
        fail_closed: true
  # ---------- Bug 流（W3-C1 .github#218 / ADR-0064，宪法 §3）----------
  # 执行者：CI-Workflows pipeline/bugflow（bug-reproduce.yml 以 App 身份写标签）。
  # conductor 对 label:bug/label:reproduced 等非 state 标签事件静默 no-op——
  # B1/B2 是状态机声明（唯一转移定义源原则：bug 流的合法转移也必须落表），
  # 由 bugflow 执行转移本体；B5 的人工/流水线双路径均满足 from_state 幂等。
  - id: B1  # Bug 流入口（免签——区别于 Feature 流签署前置）：bug form 落 bug
    # 标签 → 进 reproduce 阶段（state:bug）。无 state 标签按约定视为 ir-draft。
    from_state: ir-draft
    event: label:bug
    to_state: bug
    action: noop
    guard: "'bug' in label_set"
  - id: B2  # 三值判定之【复现】：base 稳定 fail（+fix 候选 pass）→ reproduced
    # 标签 + state:reproduced；reproduced 后产 failing repro test 待 owner 签
    # （锁定 ADR-0061 → 修复 → 关卡 → 合并）。证伪（label:cannot-reproduce）
    # 不在此列：不转移状态、不关单——保留人裁。
    from_state: bug
    event: label:reproduced
    to_state: reproduced
    action: noop
    guard: "sender_role in ['owner', 'agent']"
  - id: B3  # 修复合入：owner/agent 置 state:fixed（fix PR 的合并事实回写 bug 单）
    from_state: reproduced
    event: label:state:fixed
    to_state: fixed
    action: noop
    guard: "sender_role in ['owner', 'agent']"
  - id: B4  # 终态关单：fixed → done（owner/agent 置 state:done 后关单）
    from_state: fixed
    event: label:state:done
    to_state: done
    action: noop
    guard: "sender_role in ['owner', 'agent']"
  - id: B5  # 三值判定之【不可判定】兜底：环境错/超时/翻转，换新环境重试一次仍
    # 不可判定 → label:inconclusive + state:needs-human（转人裁）
    from_state: bug
    event: label:state:needs-human
    to_state: needs-human
    action: noop
    guard: "sender_role in ['owner', 'agent']"
